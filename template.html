<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VoiceBot Custom Activity</title>
    <link rel="stylesheet" href="https://unpkg.com/@salesforce-ux/design-system/assets/styles/salesforce-lightning-design-system.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <style>
        body { padding: 20px; background-color: #fff; }
        .setup-step { display: none; }
        .active { display: block; }
        .token-box { background-color: #f3f2f2; border: 1px solid #dddbda; padding: 10px; margin-top: 20px; }
        .token-text { word-break: break-all; font-family: monospace; font-size: 10px; color: #0070d2; }
    </style>
</head>
<body>
    <div id="step1" class="setup-step active">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Configuración de VoiceBot</h2>
        <div class="slds-form-element">
            <label class="slds-form-element__label" for="message-input">Mensaje para el contacto:</label>
            <div class="slds-form-element__control">
                <input type="text" id="message-input" class="slds-input" placeholder="Ej: ¡Hola {{Contact.Attribute.FirstName}}!" />
            </div>
        </div>
        <div class="token-box">
            <p class="slds-text-title_caps slds-m-bottom_xx-small">TOKEN DE SESIÓN JWT (VALIDADO)</p>
            <div class="token-text">TOKEN_DE_SESION_AQUI</div>
        </div>
    </div>

    <script src="js/postmonger.js"></script>
    <script src="js/customActivity.js"></script>
</body>
</html>
